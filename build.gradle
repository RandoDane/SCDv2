plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	runs {
		configureEach {
			// A typical 1080p window, so gametest screenshots match what players see.
			programArgs "--width", (System.getenv("SCD_WIN_W") ?: "1920"), "--height", (System.getenv("SCD_WIN_H") ?: "1080")
		}
	}

	mods {
		"scd" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// In-game integration tests (./gradlew runClientGameTest, needs a display - xvfb-run works):
// boots a real client, fakes a SkyBlock sidebar/boss/chat and screenshots every SCD screen.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "scd-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Build-time settings baked into the mod. The scd.wtf key is NOT one of them: anything shipped in a
// client can be read by players, so prices go through the SCD server (backend/marketProxy.js), which
// holds the key. The server address: -PscdServer=..., the SCD_SERVER env var, or the default below.
def generatedSecrets = layout.buildDirectory.dir("generated/sources/secrets")
tasks.register("generateBuildSecrets") {
	def server = (project.findProperty("scdServer") ?: System.getenv("SCD_SERVER") ?: "http://95.216.136.132:3000").toString()
	inputs.property("server", server)
	outputs.dir(generatedSecrets)
	doLast {
		def dir = generatedSecrets.get().dir("com/scd/client/net").asFile
		dir.mkdirs()
		new File(dir, "BuildSecrets.java").delete()
		new File(dir, "BuildInfo.java").text = """package com.scd.client.net;

/** Generated at build time - do not edit or commit. */
public final class BuildInfo {
	/** The SCD server this build talks to by default (market proxy, mayor, rooms, recordings). */
	public static final String SERVER = "${server}";

	private BuildInfo() {
	}
}
"""
	}
}
sourceSets.client.java.srcDir(generatedSecrets)
tasks.named("compileClientJava") { dependsOn("generateBuildSecrets") }
tasks.matching { it.name == "clientSourcesJar" || it.name == "sourcesJar" }.configureEach { dependsOn("generateBuildSecrets") }

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

test {
	useJUnitPlatform()
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
